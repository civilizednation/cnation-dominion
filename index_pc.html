<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cnation DOMINION (도미니언) PC</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #160f0b; color: #fff6df; font-family: system-ui, "Malgun Gothic", sans-serif; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    .app { width: 100vw; height: 100vh; min-width: 1180px; background: radial-gradient(circle at 12% 8%, #3f2c1f 0, transparent 28%), #21150f; position: relative; overflow: hidden; }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: grid; }

    .title { place-items: start center; padding: 8px 10px; overflow: hidden; }
    .title-wrap { width: min(100%, 1880px); height: calc(100vh - 16px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
    .title-hero { padding: 8px 14px; border: 1px solid #80633f; border-radius: 10px; background: linear-gradient(145deg, #3b281b, #2a1c14); box-shadow: 0 8px 20px #0007; text-align: center; }
    .title h1 { margin: 0; color: #fff4d2; font-family: "Trebuchet MS", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: clamp(30px, 3.1vw, 42px); line-height: 1.02; letter-spacing: .01em; font-weight: 900; }
    .title-version { margin-left: .45em; font-family: "Segoe UI", "Malgun Gothic", sans-serif; font-size: .44em; font-weight: 400; white-space: nowrap; color: #f2dfb8; }
    .title p { margin: 4px 0 0; color: #dfcda9; font-size: 15px; line-height: 1.2; }
    .title-options { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
    .title-bottom { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .panel { background: #352317; border: 1px solid #6f563b; border-radius: 8px; padding: 8px 12px; box-shadow: 0 6px 14px #0005; }
    .panel > strong { display: block; margin-bottom: 6px; color: #fff0c8; font-size: 16px; }
    .deck-panel { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .deck-grid { min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr; gap: 4px; padding-right: 0; }
    .option-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .diff-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .loading { flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #1c130e; }
    .loading-crest { font-family: Georgia, "Times New Roman", "Malgun Gothic", serif; letter-spacing: .16em; font-size: 13px; font-weight: 700; color: #9c7c4f; text-transform: uppercase; }
    .loading-bar { width: 280px; max-width: 50vw; height: 10px; border-radius: 999px; background: #3a281c; border: 1px solid #6a5035; overflow: hidden; }
    .loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d7a93f, #f4cf6d); border-radius: 999px; transition: width .12s linear; }
    .loading-text { margin: 0; max-width: 280px; color: #e9d8b8; font-size: 15px; line-height: 1.6; text-align: center; }
    .loading-text b { color: #f4cf6d; }
    .choice { min-height: 50px; padding: 8px 10px; border-radius: 7px; background: #4a3322; border: 2px solid transparent; text-align: left; overflow: hidden; }
    .choice strong { display: block; color: #fff8df; font-size: 15px; line-height: 1.12; }
    .choice span { display: block; color: #d7c09a; font-size: 12px; line-height: 1.2; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .option-grid .choice span { overflow: visible; text-overflow: clip; white-space: normal; }
    .choice.selected { border-color: #f4cf6d; background: #5f4027; }
    .sound-panel { display: grid; grid-template-rows: auto 1fr; }
    .sound-options { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 8px; align-content: center; }
    .sound-options b { color: #fff0c8; font-size: 14px; white-space: nowrap; }
    .sound-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .sound-choice { height: 32px; border-radius: 7px; background: #4a3322; border: 1px solid #6f563b; color: #ead7b8; font-size: 12px; font-weight: 800; }
    .sound-choice.selected { border-color: #f4cf6d; background: #5f4027; color: #fff8df; }
    .deck-grid .choice { min-height: 0; height: 33px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 9px; align-items: center; padding: 4px 10px; border-radius: 7px; }
    .deck-grid .choice strong { font-size: 15px; }
    .deck-grid .choice span { margin-top: 0; font-size: 12.5px; }
    .start-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-self: stretch; }
    .start-panel { display: grid; grid-template-rows: auto 1fr; }
    .start { min-width: 0; height: 42px; border-radius: 8px; background: #d7a93f; color: #2b1a0e; font-weight: 900; font-size: 15px; box-shadow: 0 5px 14px #0005; }
    .exit-start { background: #74412f; color: #fff7df; border: 1px solid #c98e65; }

    .game { grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; overflow: hidden; }
    .opponent, .player { background: #1b120d; border-color: #4f3827; }
    .opponent { padding: 7px 16px 9px; border-bottom: 1px solid #4f3827; }
    .player { padding: 7px 16px 10px; border-top: 1px solid #4f3827; background: #21150f; }
    .bar { display: flex; align-items: center; justify-content: flex-start; gap: 12px; height: 30px; color: #e9d8b8; }
    .section-label { display: inline-grid; place-items: center; min-width: 92px; height: 30px; padding: 0 14px; border-radius: 6px; background: #2f6f68; color: #fff8d9; border: 1px solid #e1bd64; box-shadow: inset 0 1px 0 #ffffff24, 0 2px 8px #0007; font-size: 18px; font-weight: 900; white-space: nowrap; }
    .stats { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
    .player .stats { flex: 0 1 auto; }
    .pill { padding: 4px 9px; border-radius: 999px; background: #3a281c; border: 1px solid #6a5035; color: #f0dfc2; font-size: 13px; white-space: nowrap; }
    .hand { display: flex; gap: 8px; overflow-x: auto; align-items: stretch; }
    .opponent .hand { height: 60px; padding-top: 6px; }
    .player .hand { height: 232px; padding-top: 6px; }
    .mini-card { flex: 0 0 auto; width: var(--pc-card-w, 144px); height: var(--pc-card-h, 223px); border-radius: 7px; background: #5b4228; border: 1px solid #8a704f; overflow: hidden; position: relative; box-shadow: 0 4px 14px #0007; }
    .mini-card img,
    .supply-card img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; -ms-interpolation-mode: bicubic; transform: translateZ(0); backface-visibility: hidden; }
    .mini-card.back { width: 38px; height: 100%; display: grid; place-items: center; background: linear-gradient(135deg, #342115, #7a4b2b); color: #f9ddb2; font-size: 18px; font-weight: 900; }
    .mini-card.disabled { cursor: default; }
    .mini-card.selected { border-color: #f4cf6d; box-shadow: 0 0 0 3px #f4cf6d, 0 8px 22px #0009; transform: translateY(-5px); }

    .center { min-height: 0; display: grid; grid-template-columns: max-content 320px; gap: 14px; padding: 9px 30px 8px 8px; overflow: hidden; align-items: stretch; }
    .supply { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
    .supply-title { display: flex; justify-content: space-between; align-items: center; min-height: 34px; color: #d9c29d; }
    .supply-grid { min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(9, var(--pc-card-w, 144px)); grid-template-rows: repeat(2, var(--pc-card-h, 223px)); gap: 4px; place-items: start; align-content: start; justify-content: start; padding: 1px 0 2px; }
    .supply-card { position: relative; width: var(--pc-card-w, 144px); height: var(--pc-card-h, 223px); min-height: 0; aspect-ratio: 31 / 48; border-radius: 7px; overflow: hidden; background: #3a291e; border: 1px solid #775d3f; box-shadow: 0 5px 14px #0007; }
    .supply-card.selected { outline: 3px solid #f4cf6d; outline-offset: -3px; }
    .supply-card.empty img { opacity: .25; filter: grayscale(1); }
    .count { position: absolute; right: 5px; top: 5px; min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 999px; background: #21150fcc; color: #fff4d5; font-size: 14px; font-weight: 900; border: 1px solid #b18b55; }
    .count.warn { color: #ffb347; border-color: #ffb347; }
    .count.danger { color: #ff4d42; border-color: #ff4d42; }

    .status { width: 320px; min-height: 0; display: grid; grid-template-rows: minmax(186px, 1fr); gap: 9px; align-self: end; transform: translate(-38px, 16px); }
    .message { min-height: 0; background: linear-gradient(145deg, #342318, #281b13); border: 1px solid #80613c; border-radius: 8px; padding: 14px 13px; font-size: 15px; line-height: 1.44; overflow: auto; color: #ead7b8; box-shadow: inset 0 1px 0 #ffffff12, 0 4px 12px #0005; }
    .message .guide { color: #fff0c2; font-weight: 800; margin-bottom: 6px; }
    .message .feed { color: #d8c3a1; font-size: .96em; }
    .message .feed .recent { color: #fff6d4; font-weight: 900; }
    .actions { min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 7px; }
    .player .actions { flex: 0 0 380px; height: 30px; }
    .action-btn { min-width: 0; border-radius: 8px; background: #684426; font-weight: 900; font-size: 15px; box-shadow: inset 0 1px 0 #ffffff14, 0 4px 10px #0006; }
    .player .action-btn { border-radius: 6px; font-size: 13px; }
    .action-btn.select-all { background: #4f5f35; color: #fff4d5; font-size: 12px; white-space: nowrap; }
    .action-btn.primary { background: #d7a93f; color: #26170c; }

    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0009; z-index: 10; }
    .modal.active { display: flex; }
    .modal-box { width: min(980px, calc(100vw - 80px)); max-height: min(820px, calc(100vh - 80px)); background: #2a1b12; border: 2px solid #d2a24a; border-radius: 16px; padding: 18px; overflow: auto; box-shadow: 0 22px 60px #000b; }
    .modal h2 { margin: 0 0 12px; font-size: 22px; }
    .modal .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .modal .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .modal .modal-actions button { flex: 1; height: 50px; border-radius: 8px; background: #674224; font-weight: 900; }
    .modal .modal-actions .ok { background: #d7a93f; color: #25180f; }
    .modal .cards .supply-card { min-height: 208px; }
    .modal .cards .supply-card .badge,
    .modal .cards .supply-card .name { display: none; }

    .end { position: fixed; inset: 0; display: none; place-items: center; padding: 28px; background: #000c; z-index: 20; }
    .end.active { display: grid; }
    .end-card { width: min(1480px, calc(100vw - 56px)); max-height: calc(100vh - 56px); background: #2e1f16; border: 2px solid #d7a93f; border-radius: 12px; padding: 16px 22px; text-align: left; overflow: auto; box-shadow: 0 20px 50px #000a; }
    .end-card h2 { margin: 0 0 6px; font-size: 30px; text-align: center; color: #fff4d2; }
    #endText { margin: 0; }
    .result-summary { padding: 8px 18px; border: 1px solid #80613c; border-radius: 10px; background: linear-gradient(145deg, #3a281c, #261911); text-align: center; }
    .result-summary span { display: block; color: #fff4d2; font-size: 19px; font-weight: 900; }
    .result-summary p { margin: 4px 0 0; color: #ead7b8; font-size: 14px; font-weight: 800; }
    .result-summary small { display: block; margin-top: 3px; color: #bfa984; font-size: 13px; }
    .result-board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
    .result-player { min-width: 0; padding: 14px; border: 1px solid #6b5036; border-radius: 10px; background: #241811; }
    .result-player-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; margin-bottom: 12px; }
    .result-player-head h3 { margin: 0; color: #fff0c8; font-size: 22px; }
    .result-player-head strong { color: #f4cf6d; font-size: 28px; }
    .result-player-head span { grid-column: 1 / -1; color: #cbb897; font-size: 14px; }
    .result-holdings { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; max-height: 430px; overflow: auto; padding-right: 2px; }
    .result-card { position: relative; min-width: 0; margin: 0; padding: 4px 4px 6px; border: 1px solid #806645; border-radius: 7px; background: #1c130e; box-shadow: 0 4px 10px #0006; }
    .result-card img { width: 100%; aspect-ratio: 31 / 48; display: block; object-fit: cover; border-radius: 4px; }
    .result-card figcaption { padding-top: 4px; text-align: center; }
    .result-card strong, .result-card span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-card strong { color: #fff0c8; font-size: 12px; }
    .result-card span { color: #f4cf6d; font-size: 12px; font-weight: 900; }
    .result-score { margin-top: 8px; padding-top: 6px; border-top: 1px solid #5e462e; color: #e2d0b2; font-size: 14px; }
    .result-score div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
    .result-score b { color: #fff0c8; }
    .result-score .total { margin-top: 6px; padding-top: 7px; border-top: 1px solid #7a5b38; color: #f4cf6d; font-size: 17px; font-weight: 900; }
    #restartBtn { display: block; width: 320px; margin: 10px auto 0; }

    @media (max-height: 900px) {
      .player .hand { height: calc(var(--pc-card-h, 210px) + 8px); }
      .status { grid-template-rows: minmax(168px, 1fr); transform: translate(-38px, 14px); }
      .message { font-size: 14px; line-height: 1.34; padding: 10px 12px; }
      .action-btn { font-size: 14px; }
      .result-holdings { grid-template-columns: repeat(7, minmax(0, 1fr)); max-height: 260px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="titleScreen" class="screen title active">
      <div class="title-wrap">
        <div class="title-hero">
          <h1>cnation DOMINION (도미니언) <span class="title-version">Version 1.1.16 PC</span></h1>
          <p>PC/노트북 버전</p>
        </div>
        <div class="title-options">
          <div class="panel deck-panel">
            <strong>왕국 카드 조합</strong>
            <div id="deckChoices" class="deck-grid"></div>
          </div>
          <div class="title-bottom">
            <div class="panel">
              <strong>컴퓨터 난이도</strong>
              <div id="difficultyChoices" class="option-grid diff-grid"></div>
            </div>
            <div class="panel">
              <strong>승패 조건</strong>
              <div id="modeChoices" class="option-grid"></div>
            </div>
            <div class="panel sound-panel">
              <strong>사운드 설정</strong>
              <div id="soundChoices" class="sound-options"></div>
            </div>
            <div class="panel start-panel">
              <strong>게임 메뉴</strong>
              <div class="start-actions">
                <button id="startBtn" class="start">PC 게임 시작</button>
                <button id="titleExitBtn" class="start exit-start">게임 종료</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="loadingScreen" class="screen loading">
      <span class="loading-crest">DOMINION</span>
      <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="loadingBarFill" class="loading-bar-fill"></div></div>
      <p class="loading-text">게임에 필요한 이미지와 음악을 불러오는 중입니다... <b id="loadingPercent">0%</b></p>
    </section>

    <section id="gameScreen" class="screen game">
      <div class="opponent">
        <div class="bar">
          <strong class="section-label">컴퓨터</strong>
          <div id="cpuStats" class="stats"></div>
        </div>
        <div id="cpuHand" class="hand"></div>
      </div>
      <div class="center">
        <div class="supply">
          <div class="supply-title">
            <strong class="section-label">공급처</strong>
          </div>
          <div id="supplyGrid" class="supply-grid"></div>
        </div>
        <div class="status">
          <div id="message" class="message"></div>
        </div>
      </div>
      <div class="player">
        <div class="bar">
          <strong class="section-label">내 덱</strong>
          <div class="actions">
            <button id="buyPhaseBtn" class="action-btn">구매 단계</button>
            <button id="selectAllBtn" class="action-btn select-all">재화카드 전체선택</button>
            <button id="endTurnBtn" class="action-btn primary">턴 종료</button>
          </div>
          <div id="playerStats" class="stats"></div>
        </div>
        <div id="playerHand" class="hand"></div>
      </div>
    </section>

    <div id="modal" class="modal">
      <div class="modal-box">
        <h2 id="modalTitle"></h2>
        <div id="modalCards" class="cards"></div>
        <div class="modal-actions">
          <button id="modalCancel">취소</button>
          <button id="modalOk" class="ok">확인</button>
        </div>
      </div>
    </div>
    <div id="endScreen" class="end">
      <div class="end-card">
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <button id="restartBtn" class="start">타이틀로</button>
      </div>
    </div>
  </main>

  <script src="./audio.js"></script>
  <script src="./game_pc.js"></script>
  <script src="./deck-intro_pc.js"></script>
  <script src="./rules-guide_pc.js"></script>
  <script src="./game-controls_pc.js"></script>
</body>
</html>
