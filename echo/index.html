<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominion Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="page">
    <div class="device" id="device">
      <div class="screen" id="screen" data-state="standby">

        <div class="view view-standby" id="viewStandby">
          <div class="crest"><span class="crest-sub">CNATION</span>DOMINION<br>ECHO</div>
          <div class="standby-sub">20 TRACKS &middot; 10 REALMS</div>
          <div class="standby-hint">MENU 를 눌러 곡을 선택하세요</div>
        </div>

        <div class="view view-playing" id="viewPlaying" hidden>
          <div class="art" id="art"></div>
          <div class="np-body">
            <div class="np-head">
              <span class="np-index" id="npIndex">01 &middot; VILLAGE</span>
              <span class="np-badge" id="npBadge">I</span>
            </div>
            <div class="np-title" id="npTitle">&mdash;</div>
            <div class="eq" id="eq" aria-hidden="true"></div>
            <div class="progress">
              <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
              <div class="progress-time">
                <span id="timeCur">0:00</span>
                <span id="timeDur">0:00</span>
              </div>
            </div>
          </div>
        </div>

        <div class="view view-library" id="viewLibrary" hidden>
          <div class="lib-head">LIBRARY</div>
          <div class="lib-list" id="libList"></div>
        </div>

      </div>

      <button class="ctrl ctrl-prev" id="btnPrev" type="button" aria-label="이전 곡"><span class="icon-skip icon-skip-back"></span></button>
      <button class="ctrl ctrl-play" id="btnPlay" type="button" aria-label="재생 또는 일시정지"><span class="icon-play"></span></button>
      <button class="ctrl ctrl-next" id="btnNext" type="button" aria-label="다음 곡"><span class="icon-skip icon-skip-fwd"></span></button>
      <button class="ctrl ctrl-menu" id="btnMenu" type="button" aria-label="라이브러리 열기"><span class="icon-menu"></span></button>
    </div>

    <p class="hint-outside">Dominion Echo &mdash; cnation-dominion 배경음악 플레이어</p>
  </main>

  <audio id="audio" preload="none"></audio>

  <script src="tracks.js"></script>
  <script src="player.js"></script>
</body>
</html>
